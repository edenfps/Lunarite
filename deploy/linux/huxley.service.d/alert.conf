# Discord status (deploy/linux/alert.sh, webhook in /etc/huxley/alert.env). Install as
# /etc/systemd/system/huxley.service.d/alert.conf.
[Service]
# dotnet exits 143 on systemd's SIGTERM: a stop or restart is not a crash.
SuccessExitStatus=143
# Backgrounded so the wait for the login port does not hold the unit in "activating".
ExecStartPost=/bin/sh -c '/opt/huxley/repo/deploy/linux/alert.sh starting >/dev/null 2>&1 &'
ExecStopPost=/opt/huxley/repo/deploy/linux/alert.sh stop
